<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" preserveAspectRatio="none">
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#f2e6c9" />
      <stop offset="1" stop-color="#d3ac5f" />
    </linearGradient>
    <filter id="grain">
      <feTurbulence baseFrequency="0.8" numOctaves="2" stitchTiles="stitch" />
      <feColorMatrix type="saturate" values="0" />
      <feBlend mode="overlay" />
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#g)"/>
  <g opacity="0.05">
    <rect x="0" y="0" width="1200" height="300" fill="#000"/>
  </g>
  <g fill="rgba(255,255,255,0.06)">
    <circle cx="80" cy="60" r="120" />
    <circle cx="300" cy="40" r="80" />
    <circle cx="1000" cy="90" r="140" />
    <circle cx="900" cy="220" r="100" />
  </g>
</svg>
