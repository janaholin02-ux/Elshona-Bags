<!-- AUTH MODAL -->
<div id="authModal" class="auth-modal">
    <div class="auth-card">
        <button class="close-btn" onclick="closeLoginModal()">✕</button>
        <div class="modal-logo">EB</div>
        <div class="auth-brand">ELSHONA BAGS</div>
        <div class="divider"></div>
        <h2 id="authTitle" class="auth-title">Welcome Back</h2>
        <p id="authSubtitle" class="subtitle">Sign in to your account</p>

        <form id="loginForm" class="auth-form" onsubmit="login(); return false;">
            <div class="form-group">
                <label for="loginUser">Username</label>
                <div class="input-wrapper">
                    <span class="input-icon"></span>
                    <input type="text" id="loginUser" class="form-input" placeholder="Enter your username or email" required>
                </div>
            </div>
            <div class="form-group">
                <label for="loginPass">Password</label>
                <div class="password-wrapper">
                    <span class="input-icon"></span>
                    <input type="password" id="loginPass" class="form-input" placeholder="Enter your password" required>
                    <span class="password-toggle" onclick="togglePasswordVisibility('loginPass')"></span>
                </div>
            </div>
            <div class="login-actions">
                <label class="checkbox-label">
                    <input type="checkbox" id="rememberMe">
                    <span>Remember me</span>
                </label>
                <a href="#" onclick="showResetPassword(); return false;">Forgot password?</a>
            </div>
            <button type="submit" class="modal-btn sign-in">Sign In</button>
        </form>

        <form id="resetForm" class="auth-form hidden" onsubmit="resetPassword(); return false;">
            <div class="form-group">
                <label for="resetUser">Username</label>
                <div class="input-wrapper">
                    <span class="input-icon"></span>
                    <input type="text" id="resetUser" class="form-input" placeholder="Enter your username" required>
                </div>
            </div>
            <div class="form-group">
                <label for="resetEmail">Email</label>
                <div class="input-wrapper">
                    <span class="input-icon"></span>
                    <input type="email" id="resetEmail" class="form-input" placeholder="Enter your email" required>
                </div>
            </div>
            <div class="form-group">
                <label for="resetOtp">OTP Code</label>
                <div class="input-wrapper">
                    <span class="input-icon"></span>
                    <input type="text" id="resetOtp" class="form-input" placeholder="Enter OTP code" required>
                    <button type="button" class="otp-btn" onclick="sendResetOtp()">Send OTP</button>
                </div>
            </div>
            <div class="form-group">
                <label for="resetPass">New Password</label>
                <div class="password-wrapper">
                    <span class="input-icon"></span>
                    <input type="password" id="resetPass" class="form-input" placeholder="Enter new password" required>
                    <span class="password-toggle" onclick="togglePasswordVisibility('resetPass')"></span>
                </div>
            </div>
            <div class="form-group">
                <label for="resetPassConfirm">Confirm Password</label>
                <div class="password-wrapper">
                    <span class="input-icon"></span>
                    <input type="password" id="resetPassConfirm" class="form-input" placeholder="Confirm new password" required>
                    <span class="password-toggle" onclick="togglePasswordVisibility('resetPassConfirm')"></span>
                </div>
            </div>
            <div class="login-actions">
                <a href="#" onclick="showLogin(); return false;">Back to Sign In</a>
            </div>
            <button type="submit" class="modal-btn sign-in">Reset Password</button>
        </form>

        <form id="signupForm" class="auth-form hidden" onsubmit="signup(); return false;">
            <div class="form-group">
                <label for="signupName">Full Name</label>
                <div class="input-wrapper">
                    <span class="input-icon"></span>
                    <input type="text" id="signupName" class="form-input" placeholder="Enter your full name" required>
                </div>
            </div>
            <div class="form-group">
                <label for="signupUser">Username</label>
                <div class="input-wrapper">
                    <span class="input-icon"></span>
                    <input type="text" id="signupUser" class="form-input" placeholder="Choose a username" required>
                </div>
            </div>
            <div class="form-group">
                <label for="signupEmail">Email</label>
                <div class="input-wrapper">
                    <span class="input-icon"></span>
                    <input type="email" id="signupEmail" class="form-input" placeholder="Enter your email" required>
                </div>
            </div>
            <div class="form-group">
                <label for="signupPass">Password</label>
                <div class="password-wrapper">
                    <span class="input-icon"></span>
                    <input type="password" id="signupPass" class="form-input" placeholder="Create a password" required>
                    <span class="password-toggle" onclick="togglePasswordVisibility('signupPass')"></span>
                </div>
            </div>
            <div class="form-group">
                <label for="signupPassConfirm">Confirm Password</label>
                <div class="password-wrapper">
                    <span class="input-icon"></span>
                    <input type="password" id="signupPassConfirm" class="form-input" placeholder="Confirm password" required>
                    <span class="password-toggle" onclick="togglePasswordVisibility('signupPassConfirm')"></span>
                </div>
            </div>
            <label class="checkbox-label" style="font-size:12px; margin-bottom:12px;">
                <input type="checkbox" id="agreeSignup" required>
                <span>I agree to the <a href="#" style="color:#6b4bb0; text-decoration:none;">Terms & Conditions</a> and <a href="#" style="color:#6b4bb0; text-decoration:none;">Privacy Policy</a></span>
            </label>
            <button type="submit" class="modal-btn sign-in">Create Account</button>
        </form>

        <div class="divider-row"><span>or</span></div>
        <p class="signup-link" id="authSwitch">Don't have an account? <a href="#" onclick="showSignup(); return false;">Sign Up</a></p>
    </div>
</div>
